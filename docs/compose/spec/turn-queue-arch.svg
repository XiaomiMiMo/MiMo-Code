<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#334155" stroke-width="1"/>
    </marker>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#0F766E" stroke-width="1"/>
    </marker>
  </defs>
  <rect width="760" height="640" fill="#F8FAFC"/>

  <!-- Admitters -->
  <text x="40" y="36" font-size="13" font-weight="500" fill="#0F172A">准入入口（异构 Intent，不是同质 priority 队列）</text>
  <rect x="40" y="52" width="140" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.5"/>
  <text x="110" y="72" font-size="12" text-anchor="middle" fill="#0C4A6E">HTTP prompt</text>
  <text x="110" y="88" font-size="11" text-anchor="middle" fill="#0369A1">admit(prompt)</text>

  <rect x="200" y="52" width="140" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.5"/>
  <text x="270" y="72" font-size="12" text-anchor="middle" fill="#0C4A6E">resume</text>
  <text x="270" y="88" font-size="11" text-anchor="middle" fill="#0369A1">admit(resume)</text>

  <rect x="360" y="52" width="140" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.5"/>
  <text x="430" y="72" font-size="12" text-anchor="middle" fill="#0C4A6E">inbox / notify</text>
  <text x="430" y="88" font-size="11" text-anchor="middle" fill="#0369A1">admit(wake)</text>

  <rect x="520" y="52" width="140" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="4 2"/>
  <text x="590" y="72" font-size="12" text-anchor="middle" fill="#94A3B8">cron / system</text>
  <text x="590" y="88" font-size="11" text-anchor="middle" fill="#94A3B8">future · not in Intent</text>

  <!-- Receipt -->
  <rect x="40" y="120" width="620" height="36" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="0.5"/>
  <text x="350" y="142" font-size="12" text-anchor="middle" fill="#065F46">Receipt: accepted → claimed → settled | cancelled | rejected（幂等键 + 完成回执）</text>

  <line x1="110" y1="96" x2="110" y2="120" stroke="#334155" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="270" y1="96" x2="270" y2="120" stroke="#334155" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="430" y1="96" x2="430" y2="120" stroke="#334155" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Lane boxes -->
  <rect x="40" y="180" width="680" height="200" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="56" y="204" font-size="13" font-weight="500" fill="#0F172A">Lane Controller（每 (sessionID, agentID) 一个）——唯一调度权</text>

  <rect x="60" y="224" width="200" height="120" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="0.5"/>
  <text x="160" y="248" font-size="12" font-weight="500" text-anchor="middle" fill="#78350F">Mailbox</text>
  <text x="160" y="268" font-size="11" text-anchor="middle" fill="#92400E">Intent 异构队列</text>
  <text x="160" y="288" font-size="11" text-anchor="middle" fill="#92400E">prompt / resume / wake</text>
  <text x="160" y="308" font-size="11" text-anchor="middle" fill="#92400E">coalesce wake，不 coalesce 命令</text>
  <text x="160" y="328" font-size="11" text-anchor="middle" fill="#B45309">inputRevision 单调递增</text>

  <rect x="290" y="224" width="200" height="120" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="0.5"/>
  <text x="390" y="248" font-size="12" font-weight="500" text-anchor="middle" fill="#4C1D95">Claim &amp; Frontier</text>
  <text x="390" y="268" font-size="11" text-anchor="middle" fill="#5B21B6">一次 iteration claim 一批</text>
  <text x="390" y="288" font-size="11" text-anchor="middle" fill="#5B21B6">记录 consumed frontier</text>
  <text x="390" y="308" font-size="11" text-anchor="middle" fill="#5B21B6">ack 后再取下一批</text>
  <text x="390" y="328" font-size="11" text-anchor="middle" fill="#6D28D9">原子决定 more work | idle</text>

  <rect x="520" y="224" width="180" height="120" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.5"/>
  <text x="610" y="248" font-size="12" font-weight="500" text-anchor="middle" fill="#7F1D1D">Cancel Epoch</text>
  <text x="610" y="268" font-size="11" text-anchor="middle" fill="#991B1B">abort 递增 epoch</text>
  <text x="610" y="288" font-size="11" text-anchor="middle" fill="#991B1B">旧 epoch 不得自动开跑</text>
  <text x="610" y="308" font-size="11" text-anchor="middle" fill="#991B1B">queued 策略可配</text>
  <text x="610" y="328" font-size="11" text-anchor="middle" fill="#B91C1C">disconnect ≠ cancel session</text>

  <line x1="260" y1="284" x2="290" y2="284" stroke="#334155" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="490" y1="284" x2="520" y2="284" stroke="#334155" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Arrow receipt to controller -->
  <line x1="350" y1="156" x2="350" y2="180" stroke="#334155" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Runner -->
  <rect x="40" y="410" width="320" height="120" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="56" y="434" font-size="13" font-weight="500" fill="#0F172A">Runner（执行层，不再做准入）</text>
  <text x="56" y="458" font-size="11" fill="#475569">独占 lease；占用则拒绝，不静默排队</text>
  <text x="56" y="478" font-size="11" fill="#475569">负责 fiber 生命周期 / cancel / finalizer barrier</text>
  <text x="56" y="498" font-size="11" fill="#475569">与 Controller 一一对应于 lane</text>
  <text x="56" y="518" font-size="11" fill="#64748B">迁走现有 ensureRunning 的 pending 语义</text>

  <line x1="200" y1="380" x2="200" y2="410" stroke="#334155" stroke-width="1" marker-end="url(#arr)"/>
  <text x="210" y="398" font-size="11" fill="#475569">execute(claimed batch)</text>

  <!-- Steer channel -->
  <rect x="400" y="410" width="320" height="120" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1"/>
  <text x="416" y="434" font-size="13" font-weight="500" fill="#134E4A">Steer 控制通道（level-triggered）</text>
  <text x="416" y="458" font-size="11" fill="#115E59">observeInput(lane, afterRev)</text>
  <text x="416" y="478" font-size="11" fill="#115E59">wait 等 revision 变化，不订 queue head</text>
  <text x="416" y="498" font-size="11" fill="#115E59">steer = 协作 yield；cancel = 终止</text>
  <text x="416" y="518" font-size="11" fill="#0F766E">替代 PromptQueued / 双 user 启发式</text>

  <!-- Tools -->
  <rect x="40" y="560" width="200" height="48" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5"/>
  <text x="140" y="580" font-size="12" text-anchor="middle" fill="#334155">yield-capable 工具</text>
  <text x="140" y="598" font-size="11" text-anchor="middle" fill="#64748B">actor wait 等</text>

  <rect x="260" y="560" width="200" height="48" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5"/>
  <text x="360" y="580" font-size="12" text-anchor="middle" fill="#334155">runLoop</text>
  <text x="360" y="598" font-size="11" text-anchor="middle" fill="#64748B">迭代边界 yield / ack frontier</text>

  <rect x="480" y="560" width="240" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="0.5"/>
  <text x="600" y="580" font-size="12" text-anchor="middle" fill="#78350F">维护任务（checkpoint writer 等）</text>
  <text x="600" y="598" font-size="11" text-anchor="middle" fill="#92400E">依赖感知并发，不可永远最低优先</text>

  <line x1="140" y1="560" x2="140" y2="530" stroke="#0F766E" stroke-width="1" marker-end="url(#arrA)"/>
  <line x1="360" y1="560" x2="360" y2="530" stroke="#334155" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="600" y1="560" x2="600" y2="530" stroke="#D97706" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>

  <!-- key -->
  <text x="40" y="630" font-size="11" fill="#64748B">硬约束：唯一准入=Controller · 唯一消费=claim batch · steer 用 inputRevision · cancel 用 epoch fence</text>
</svg>
