<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 720" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#64748B" stroke-width="1"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#DC2626" stroke-width="1"/>
    </marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#059669" stroke-width="1"/>
    </marker>
  </defs>
  <rect width="780" height="720" fill="#F8FAFC"/>
  <text x="390" y="28" font-size="14" font-weight="500" text-anchor="middle" fill="#0F172A">现状 → 目标：调度层相对改动</text>

  <!-- LEFT: current -->
  <rect x="24" y="48" width="350" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="40" y="72" font-size="13" font-weight="500" fill="#0F172A">现状（含 wait-interrupt 止血）</text>

  <rect x="40" y="88" width="318" height="48" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.5"/>
  <text x="199" y="108" font-size="12" text-anchor="middle" fill="#0C4A6E">HTTP /message</text>
  <text x="199" y="124" font-size="11" text-anchor="middle" fill="#0369A1">idle→直接跑 · busy→noReply+202 特判</text>

  <rect x="40" y="150" width="318" height="52" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.5"/>
  <text x="199" y="170" font-size="12" text-anchor="middle" fill="#7F1D1D">Session.PromptQueued（临时 bus）</text>
  <text x="199" y="188" font-size="11" text-anchor="middle" fill="#991B1B">仅 waiter 认识的特例事件</text>

  <rect x="40" y="216" width="318" height="64" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="0.5"/>
  <text x="199" y="236" font-size="12" text-anchor="middle" fill="#78350F">Runner.ensureRunning</text>
  <text x="199" y="254" font-size="11" text-anchor="middle" fill="#92400E">Running→join / 挂一个 pending</text>
  <text x="199" y="270" font-size="11" text-anchor="middle" fill="#B45309">兼做准入 + 执行 + 完成权</text>

  <rect x="40" y="294" width="318" height="56" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="0.5"/>
  <text x="199" y="314" font-size="12" text-anchor="middle" fill="#4C1D95">runLoop newerUser pickup</text>
  <text x="199" y="332" font-size="11" text-anchor="middle" fill="#5B21B6">对话层扫消息，无显式 frontier/ack</text>

  <rect x="40" y="364" width="318" height="56" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5"/>
  <text x="199" y="384" font-size="12" text-anchor="middle" fill="#334155">waiter：事件 + 「≥2 user」启发式</text>
  <text x="199" y="402" font-size="11" text-anchor="middle" fill="#64748B">subscribe 间隙 / 误伤需启发式补</text>

  <rect x="40" y="432" width="318" height="28" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="199" y="450" font-size="11" text-anchor="middle" fill="#64748B">HTTP disconnect → cancel 整个 session</text>

  <!-- arrows current -->
  <line x1="199" y1="136" x2="199" y2="150" stroke="#64748B" stroke-width="1" marker-end="url(#a1)"/>
  <line x1="199" y1="202" x2="199" y2="216" stroke="#64748B" stroke-width="1" marker-end="url(#a1)"/>
  <line x1="199" y1="280" x2="199" y2="294" stroke="#64748B" stroke-width="1" marker-end="url(#a1)"/>

  <!-- CENTER: delta labels -->
  <text x="390" y="500" font-size="12" font-weight="500" text-anchor="middle" fill="#0F172A">相对改动</text>

  <rect x="24" y="516" width="220" height="88" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.5"/>
  <text x="134" y="538" font-size="12" font-weight="500" text-anchor="middle" fill="#7F1D1D">删除 / 吸收</text>
  <text x="134" y="558" font-size="11" text-anchor="middle" fill="#991B1B">PromptQueued 事件</text>
  <text x="134" y="576" font-size="11" text-anchor="middle" fill="#991B1B">≥2 user 启发式</text>
  <text x="134" y="594" font-size="11" text-anchor="middle" fill="#991B1B">route 202/409 分支逻辑</text>

  <rect x="254" y="516" width="220" height="88" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="0.5"/>
  <text x="364" y="538" font-size="12" font-weight="500" text-anchor="middle" fill="#78350F">改造</text>
  <text x="364" y="558" font-size="11" text-anchor="middle" fill="#92400E">Runner：去 pending 准入</text>
  <text x="364" y="576" font-size="11" text-anchor="middle" fill="#92400E">inbox wake → admit(wake)</text>
  <text x="364" y="594" font-size="11" text-anchor="middle" fill="#92400E">disconnect 只退订 receipt</text>

  <rect x="484" y="516" width="272" height="88" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="0.5"/>
  <text x="620" y="538" font-size="12" font-weight="500" text-anchor="middle" fill="#065F46">新增</text>
  <text x="620" y="558" font-size="11" text-anchor="middle" fill="#047857">LaneController + Mailbox + Receipt</text>
  <text x="620" y="576" font-size="11" text-anchor="middle" fill="#047857">observeInput(revision) steer</text>
  <text x="620" y="594" font-size="11" text-anchor="middle" fill="#047857">cancel epoch + claim batch</text>

  <!-- RIGHT: target -->
  <rect x="406" y="48" width="350" height="420" rx="10" fill="#FFFFFF" stroke="#059669"/>
  <text x="422" y="72" font-size="13" font-weight="500" fill="#065F46">目标</text>

  <rect x="422" y="88" width="318" height="48" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.5"/>
  <text x="581" y="108" font-size="12" text-anchor="middle" fill="#0C4A6E">admit(lane, intent, idemKey)</text>
  <text x="581" y="124" font-size="11" text-anchor="middle" fill="#0369A1">统一入口，返回 Receipt</text>

  <rect x="422" y="150" width="318" height="64" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="0.5"/>
  <text x="581" y="170" font-size="12" text-anchor="middle" fill="#78350F">LaneController（唯一调度）</text>
  <text x="581" y="188" font-size="11" text-anchor="middle" fill="#92400E">Mailbox + inputRevision + epoch</text>
  <text x="581" y="204" font-size="11" text-anchor="middle" fill="#B45309">原子 more-work / idle</text>

  <rect x="422" y="228" width="318" height="56" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="0.5"/>
  <text x="581" y="248" font-size="12" text-anchor="middle" fill="#4C1D95">Claim batch + frontier ack</text>
  <text x="581" y="266" font-size="11" text-anchor="middle" fill="#5B21B6">一次迭代消费一批，显式回执</text>

  <rect x="422" y="298" width="318" height="56" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5"/>
  <text x="581" y="318" font-size="12" text-anchor="middle" fill="#334155">Runner：独占 lease</text>
  <text x="581" y="336" font-size="11" text-anchor="middle" fill="#64748B">只执行/cancel，不再静默排队</text>

  <rect x="422" y="368" width="318" height="56" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="0.5"/>
  <text x="581" y="388" font-size="12" text-anchor="middle" fill="#134E4A">observeInput(afterRev) → wait interrupted</text>
  <text x="581" y="406" font-size="11" text-anchor="middle" fill="#115E59">level-triggered，无启发式</text>

  <rect x="422" y="432" width="318" height="28" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="581" y="450" font-size="11" text-anchor="middle" fill="#065F46">cancel(epoch) fence；transport 与 turn 解耦</text>

  <line x1="581" y1="136" x2="581" y2="150" stroke="#059669" stroke-width="1" marker-end="url(#a3)"/>
  <line x1="581" y1="214" x2="581" y2="228" stroke="#059669" stroke-width="1" marker-end="url(#a3)"/>
  <line x1="581" y1="284" x2="581" y2="298" stroke="#059669" stroke-width="1" marker-end="url(#a3)"/>
  <line x1="581" y1="354" x2="581" y2="368" stroke="#059669" stroke-width="1" marker-end="url(#a3)"/>

  <!-- mapping arrows left to right -->
  <line x1="358" y1="112" x2="422" y2="112" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#a2)"/>
  <text x="390" y="106" font-size="10" text-anchor="middle" fill="#DC2626">替换</text>

  <line x1="358" y1="176" x2="422" y2="176" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#a2)"/>
  <text x="390" y="170" font-size="10" text-anchor="middle" fill="#DC2626">删除</text>

  <line x1="358" y1="248" x2="422" y2="326" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#a2)"/>
  <text x="392" y="280" font-size="10" text-anchor="middle" fill="#B45309">拆权</text>

  <line x1="358" y1="322" x2="422" y2="256" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#a2)"/>
  <text x="392" y="300" font-size="10" text-anchor="middle" fill="#6D28D9">上收</text>

  <line x1="358" y1="392" x2="422" y2="392" stroke="#0F766E" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#a3)"/>
  <text x="390" y="386" font-size="10" text-anchor="middle" fill="#0F7669">替换</text>

  <text x="390" y="640" font-size="11" text-anchor="middle" fill="#475569">语义差异：priority 只决定「谁有资格跑」；对话顺序仍按消息 frontier，不重排历史</text>
  <text x="390" y="660" font-size="11" text-anchor="middle" fill="#64748B">Lane = (sessionID, agentID) · wake 可 coalesce，prompt/resume 不可 · 已 accept 的工作需 durable</text>
  <text x="390" y="690" font-size="11" text-anchor="middle" fill="#94A3B8">迁移顺序建议：Controller+Mailbox → steer revision → Runner 拆 pending → 删 PromptQueued 止血路径</text>
</svg>
