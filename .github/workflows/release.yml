name: release
run-name: ${{ inputs.build_only && 'Build only' || 'Release' }} ${{ github.ref_name }}

# Push a vX.Y.Z tag on a main commit whose package versions already equal X.Y.Z.
# To recover, prefer "Re-run failed jobs": every publish stage skips work that
# already landed. A fresh manual run must be started from the tag ref.
# To check the build without releasing, dispatch from any branch with build_only:
#   gh workflow run release.yml --ref <branch> -f build_only=true
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build and upload the artifacts from this ref; skip the tag check and every publish step"
        type: boolean
        default: false

concurrency:
  # Build-only runs never queue behind or ahead of a real release.
  group: ${{ inputs.build_only && format('release-build-only-{0}', github.ref_name) || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Verify tag, main ancestry and package versions
        if: ${{ !inputs.build_only }}
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from a vX.Y.Z tag, not $REF_TYPE $REF_NAME"
            exit 1
          fi
          MIMOCODE_VERSION="$REF_NAME" bun script/release.ts verify

  typecheck:
    needs: verify
    uses: ./.github/workflows/typecheck.yml

  lint:
    needs: verify
    uses: ./.github/workflows/lint.yml

  # Bun cross-compiles every target and ad-hoc signs the darwin binaries itself.
  build:
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Build archives and npm tarballs
        if: ${{ !inputs.build_only }}
        env:
          MIMOCODE_VERSION: ${{ github.ref_name }}
        run: bun script/release.ts build

      - name: Build archives and npm tarballs (build only)
        if: ${{ inputs.build_only }}
        run: bun script/release.ts build check

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.build_only && format('build-only-{0}', github.sha) || format('release-{0}', github.ref_name) }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    if: ${{ !inputs.build_only }}
    needs: build
    runs-on: ubuntu-latest
    # npm trusted publishers can be bound to this environment; add reviewers to it for a manual gate.
    environment: release
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      MIMOCODE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Trusted publishing (OIDC) needs npm >= 11.5.1; no npm token is stored.
      - name: Install npm 11
        run: npm install -g npm@11

      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: dist/release/

      # Gate before any publish stage: fail on missing tarballs or unusable FDS
      # so npm/GitHub cannot half-ship.
      - name: Preflight tarballs and FDS
        env:
          MIMO_FDS_AK: ${{ secrets.MIMO_FDS_AK }}
          MIMO_FDS_SK: ${{ secrets.MIMO_FDS_SK }}
          MIMO_FDS_ENDPOINT: ${{ vars.MIMO_FDS_ENDPOINT }}
          MIMO_FDS_BUCKET: ${{ vars.MIMO_FDS_BUCKET }}
          MIMO_FDS_PREFIX: ${{ vars.MIMO_FDS_PREFIX }}
        run: bun script/release.ts preflight

      # Libraries first: a released binary may resolve @mimo-ai/plugin at its own version.
      - name: npm — SDK and plugin
        run: bun script/release.ts npm libs

      - name: GitHub Release
        run: bun script/release.ts github

      - name: FDS archives, then releases/latest
        env:
          MIMO_FDS_AK: ${{ secrets.MIMO_FDS_AK }}
          MIMO_FDS_SK: ${{ secrets.MIMO_FDS_SK }}
          MIMO_FDS_ENDPOINT: ${{ vars.MIMO_FDS_ENDPOINT }}
          MIMO_FDS_BUCKET: ${{ vars.MIMO_FDS_BUCKET }}
          MIMO_FDS_PREFIX: ${{ vars.MIMO_FDS_PREFIX }}
        run: bun script/release.ts fds

      - name: npm — @mimo-ai/cli launcher
        run: bun script/release.ts npm cli

      - name: Sync China npm mirrors
        continue-on-error: true
        run: bun script/sync-registry.ts
