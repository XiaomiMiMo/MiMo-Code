name: release-desktop

on:
  push:
    tags:
      - "desktop/v*"
      - "v*-desktop"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. desktop/v1.2.3)"
        required: true
      channel:
        description: "Release channel"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - beta
          - dev

concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  # 从 tag 推断 channel（desktop/v1.0.0-beta.1 → beta，否则 prod）
  OPENCODE_CHANNEL: >-
    ${{
      inputs.channel != '' && inputs.channel ||
      (contains(github.ref_name, 'beta') && 'beta' || 'prod')
    }}

jobs:
  # ── 1. 类型检查 ─────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun

      - name: Typecheck desktop
        working-directory: packages/desktop
        run: bun run typecheck

  # ── 2. 构建 & 打包（macOS / Windows / Linux）────────────────────
  package-mac:
    name: Package macOS
    needs: typecheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun

      - name: Build desktop renderer & main
        working-directory: packages/desktop
        run: bun run build

      - name: Package macOS (dmg + zip)
        working-directory: packages/desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run package:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
          if-no-files-found: error

