name: desktop macOS release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15
    if: |
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]'))
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      DEVORA_CHANNEL: prod
      DEVORA_UPDATE_OWNER: SheriAkhtamov
      DEVORA_UPDATE_REPO: Devora
      DEVORA_SIGN_MAC: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Resolve release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            git fetch --tags
            LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -1)

            if [ -z "$LATEST_TAG" ]; then
              VERSION="0.1.0"
            else
              BASE="${LATEST_TAG#v}"
              MAJOR=$(echo "$BASE" | cut -d. -f1)
              MINOR=$(echo "$BASE" | cut -d. -f2)
              PATCH=$(echo "$BASE" | cut -d. -f3)
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi

            if gh release view "v${VERSION}" &>/dev/null; then
              echo "Release v${VERSION} already exists, skipping"
              exit 0
            fi

            echo "Auto-bumped version: $LATEST_TAG -> v${VERSION}"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v${VERSION}" -m "${VERSION}"
            git push origin "v${VERSION}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v${VERSION}" -m "${VERSION}"
            git push origin "v${VERSION}"
          fi

          echo "DEVORA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Prepare desktop version
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts

      - name: Build desktop app
        working-directory: packages/desktop
        run: bun run build

      - name: Package and publish macOS release
        working-directory: packages/desktop
        run: bun run package:mac -- --arm64 --publish always

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devora-desktop-macos-${{ env.DEVORA_VERSION }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/latest-mac.yml
          if-no-files-found: error