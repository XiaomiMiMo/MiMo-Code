name: Build & Release Desktop

on:
  push:
    tags:
      - "v*"          # 打 tag 时自动构建并发布 Release
  workflow_dispatch:   # 也可手动触发

permissions:
  contents: write

env:
  OPENCODE_CHANNEL: prod
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            target: package:win
          - os: macos-latest
            platform: mac
            target: package:mac
          - os: ubuntu-latest
            platform: linux
            target: package:linux

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build opencode node bundle
        run: cd packages/opencode && bun run script/build-node.ts

      - name: Prebuild (copy icons)
        run: cd packages/desktop && bun ./scripts/prebuild.ts

      - name: Build desktop app
        run: cd packages/desktop && bun run build

      - name: Package (${{ matrix.platform }})
        run: cd packages/desktop && bun run ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ""

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
