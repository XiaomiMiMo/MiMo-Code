name: Feature request
description: Suggest an idea, feature, or enhancement for Devora
labels: [discussion]
title: "[FEATURE]:"

body:
  - type: checkboxes
    id: verified
    attributes:
      label: This feature has not been suggested before.
      options:
        - label: I checked existing Devora issues before opening this request.
          required: true

  - type: textarea
    attributes:
      label: Describe the enhancement
      description: What should Devora change or add, and why would it help?
    validations:
      required: true
