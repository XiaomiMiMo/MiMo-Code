[install]
exact = true

[test]
# Discovery root: only root-level script tests. Engine/package suites live
# under packages/*/test and must run from that package (see packages/cli/bunfig.toml).
root = "./script"
# Order matters: isolate env first, then policy-guard packages/** paths.
preload = ["./script/test-isolation-env.ts", "./script/forbid-unisolated-engine-tests.ts"]
