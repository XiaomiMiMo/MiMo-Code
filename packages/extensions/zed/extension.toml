id = "devora"
name = "Devora"
description = "Devora, Sheri Akhtamov's open source coding agent."
version = "0.1.0"
schema_version = 1
authors = ["SheriAkhtamov"]
repository = "https://github.com/SheriAkhtamov/Devora"

[agent_servers.devora]
name = "Devora"
icon = "./icons/devora.svg"

[agent_servers.devora.targets.darwin-aarch64]
archive = "https://github.com/SheriAkhtamov/Devora/releases/latest/download/devora-darwin-arm64.zip"
cmd = "./devora"
args = ["acp"]

[agent_servers.devora.targets.darwin-x86_64]
archive = "https://github.com/SheriAkhtamov/Devora/releases/latest/download/devora-darwin-x64.zip"
cmd = "./devora"
args = ["acp"]

[agent_servers.devora.targets.linux-aarch64]
archive = "https://github.com/SheriAkhtamov/Devora/releases/latest/download/devora-linux-arm64.tar.gz"
cmd = "./devora"
args = ["acp"]

[agent_servers.devora.targets.linux-x86_64]
archive = "https://github.com/SheriAkhtamov/Devora/releases/latest/download/devora-linux-x64.tar.gz"
cmd = "./devora"
args = ["acp"]

[agent_servers.devora.targets.windows-x86_64]
archive = "https://github.com/SheriAkhtamov/Devora/releases/latest/download/devora-windows-x64.zip"
cmd = "./devora.exe"
args = ["acp"]
